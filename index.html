<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caha</title>
  <meta name="description" content="Caha — a cafe in motion. Scroll to move through the story.">
  <meta name="theme-color" content="#0b0806">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fixed full-screen stage: the animation canvas -->
  <div id="stage">
    <canvas id="frame"></canvas>
    <div id="vignette"></div>
  </div>

  <!-- Top chrome -->
  <div id="progress"><div id="progress-fill"></div></div>
  <header id="topbar">
    <span class="brand-small">caha</span>
    <span id="progress-label">01 / 14</span>
  </header>

  <!-- Scene info, bottom-left -->
  <div id="scene-info">
    <span id="scene-index">01</span>
    <span id="scene-title">Scene 01</span>
  </div>

  <!-- Scroll hint, bottom-center -->
  <div id="hint">
    <span>scroll</span>
    <span class="chev"></span>
  </div>

  <!-- Brand wordmark, bottom-right — sits over the watermark corner -->
  <div id="wordmark">Caha</div>

  <!-- Loading screen -->
  <div id="loader">
    <div class="loader-brand">Caha</div>
    <div class="loader-bar"><div id="loader-fill"></div></div>
    <div id="loader-pct">0%</div>
  </div>

  <!-- Invisible element that creates the scrollable length -->
  <div id="spacer" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
